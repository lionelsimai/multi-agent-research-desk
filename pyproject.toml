[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-desk"
version = "0.1.0"
description = "Researcher + writer + fact-checker desk with consensus logic and verified citations"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lionel Sim", email = "lionel@theaicapitol.com"}]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "evaluation", "open-source"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.urls]
Homepage = "https://github.com/lionelsimai/multi-agent-research-desk"
Repository = "https://github.com/lionelsimai/multi-agent-research-desk"
Issues = "https://github.com/lionelsimai/multi-agent-research-desk/issues"

[project.scripts]
research-desk = "research_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
